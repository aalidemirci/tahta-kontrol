{% extends "taban.html" %}
{% block baslik %}Giriş · Tahta Kontrol{% endblock %}
{% block icerik %}
<div class="kutu giris-kutusu">
  <h1>Tahta Kontrol</h1>
  {% if okul_adi %}<p class="not">{{ okul_adi }}</p>{% endif %}
  <form method="post" action="/giris">
    <label for="ad">Kullanıcı adı</label>
    <input type="text" id="ad" name="ad" autocomplete="username" autofocus required>
    <label for="parola">Parola</label>
    <input type="password" id="parola" name="parola" autocomplete="current-password" required>
    <p><button class="ana">Giriş yap</button></p>
  </form>
</div>
{% endblock %}
