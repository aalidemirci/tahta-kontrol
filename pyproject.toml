[project]
name = "tahta-kontrol"
version = "0.13.0"
description = "Okul ağında etkileşimli tahta kontrol ve duyuru sistemi"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "python-multipart>=0.0.12",
    "cryptography>=43",
    "tzdata>=2024.1",
    "xlrd==2.0.1",
    "pypdf>=6.21.4,<7",
    "pywin32>=308 ; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.7"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "S603", "S606", "S607", "S104", "S110", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
